<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PLATEX</title>
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0D10'/%3E%3Crect x='6' y='19' width='52' height='26' rx='6' fill='%23e9ebef' stroke='%232878FF' stroke-width='2.5'/%3E%3Cpath d='M7.5 25a5 5 0 0 1 5-4.5H19v23h-6.5a5 5 0 0 1-5-4.5z' fill='%232878FF'/%3E%3Cpath d='M26 38V27h6a3.2 3.2 0 0 1 0 6.4h-6M38 27l8 11M46 27l-8 11' fill='none' stroke='%23111' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var __s=JSON.parse(localStorage.getItem('nomerua.save.v1'));var __t=__s&&__s.settings&&__s.settings.theme;if(['midnight','carbon','arctic','neon'].indexOf(__t)>-1)document.documentElement.setAttribute('data-theme',__t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root,[data-theme=midnight]{
  --bg:#0B0D10;--card:#15191F;--card2:#1b2129;--line:#262d38;--line2:#3a4554;--text:#e9edf3;--mute:#8d97a6;
  --blue:#2878FF;--blue-d:#1d5fd1;--acc-h:#3a86ff;--acc-rgb:40,120,255;--on-acc:#fff;
  --soft:#232a34;--soft2:#2a313c;--hover:#222a34;--topbg:rgba(11,13,16,.9);--navbg:rgba(15,18,23,.96);--toastbg:#1a2028;--scrim:rgba(5,6,8,.72);
  --dais1:#2b323d;--dais2:#171b22;--dais3:#0d1014;--sh:none;--danger-b:#5a2a2a;--danger-t:#ff9a92;--amb:.16;
  --logo-grad:linear-gradient(180deg,#ffffff 0%,#dfe3e9 38%,#8f98a6 52%,#d3d8df 72%,#f6f8fa 100%);
  --r-common:#8b94a3;--r-uncommon:#4aa3a0;--r-rare:#2878FF;--r-epic:#9b7bf2;--r-legendary:#d9a441;--r-mythic:#ffe2a0;--r-none:#8b94a3;
  --gold:#d9a441;--ok:#3fb27f;--bad:#e5645a;color-scheme:dark}
[data-theme=carbon]{
  --bg:#09090a;--card:#141415;--card2:#1c1c1e;--line:#2c2c2f;--line2:#4a4a50;--text:#ededee;--mute:#9b9ba1;
  --blue:#e0262d;--blue-d:#b01920;--acc-h:#f0373e;--acc-rgb:224,38,45;--on-acc:#fff;
  --soft:#242426;--soft2:#303033;--hover:#222224;--topbg:rgba(9,9,10,.92);--navbg:rgba(12,12,13,.97);--toastbg:#1a1a1c;--scrim:rgba(0,0,0,.78);
  --dais1:#3c3d41;--dais2:#1e1e21;--dais3:#0e0e10;--sh:none;--danger-b:#5a2a2a;--danger-t:#ff9a92;--amb:.07;--silver:#c9ced6;
  --logo-grad:linear-gradient(180deg,#ffffff 0%,#d8dce2 38%,#868e9b 52%,#cfd4db 72%,#f2f4f6 100%);
  --r-common:#9b9ba1;--r-uncommon:#6fb3a8;--r-rare:#5b9bff;--r-epic:#b394ff;--r-legendary:#e3a93a;--r-mythic:#ffe2a0;--r-none:#9b9ba1;
  --gold:#d9a441;--ok:#3fb27f;--bad:#ff6b63;color-scheme:dark;
  --tex:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.4) 0 2px,transparent 2px 5px)}
[data-theme=arctic]{
  --bg:#eceff3;--card:#ffffff;--card2:#f3f5f8;--line:#d8dee6;--line2:#b9c3cf;--text:#14202e;--mute:#566273;
  --blue:#1b78d8;--blue-d:#1560b0;--acc-h:#2a89ea;--acc-rgb:27,120,216;--on-acc:#fff;
  --soft:#e2e7ee;--soft2:#cdd5df;--hover:#e8ecf1;--topbg:rgba(236,239,243,.9);--navbg:rgba(255,255,255,.97);--toastbg:#ffffff;--scrim:rgba(20,32,46,.45);
  --dais1:#e4e8ee;--dais2:#c4cbd5;--dais3:#a9b2bf;--sh:0 1px 2px rgba(20,32,46,.06),0 10px 26px -14px rgba(20,32,46,.22);--danger-b:#e8b8b3;--danger-t:#b3261e;--amb:.14;
  --logo-grad:linear-gradient(180deg,#6b7684 0%,#2a323c 45%,#1b222b 52%,#4a5563 75%,#7a8594 100%);
  --r-common:#5d6877;--r-uncommon:#1f7d79;--r-rare:#1b66d6;--r-epic:#6a4bd0;--r-legendary:#a5701a;--r-mythic:#946600;--r-none:#5d6877;
  --gold:#a8741a;--ok:#1f9d63;--bad:#c93a30;color-scheme:light}
[data-theme=neon]{
  --bg:#0d0618;--card:#170d2a;--card2:#1f1337;--line:#33205a;--line2:#5a3fa0;--text:#f0eaff;--mute:#a99bcf;
  --blue:#8b5cf6;--blue-d:#6a3fe0;--acc-h:#9d74ff;--acc-rgb:139,92,246;--on-acc:#fff;
  --soft:#2a1a4a;--soft2:#3a2766;--hover:#271645;--topbg:rgba(13,6,24,.9);--navbg:rgba(18,10,34,.96);--toastbg:#1e1236;--scrim:rgba(5,2,12,.78);
  --dais1:#3d2470;--dais2:#241240;--dais3:#12081f;--sh:0 0 0 1px rgba(139,92,246,.08);--danger-b:#6a2a4a;--danger-t:#ff9ab8;--amb:.26;
  --logo-grad:linear-gradient(180deg,#ffffff 0%,#e4dcf7 38%,#9a8cc0 52%,#d9d0f0 72%,#f8f5ff 100%);
  --r-common:#a99bcf;--r-uncommon:#38d6c4;--r-rare:#5aa2ff;--r-epic:#c084fc;--r-legendary:#ffc247;--r-mythic:#ffe9b0;--r-none:#a99bcf;
  --gold:#ffc247;--ok:#3ddc97;--bad:#ff6b8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.r0{--c:var(--r-common)}.r1{--c:var(--r-uncommon)}.r2{--c:var(--r-rare)}.r3{--c:var(--r-epic)}.r4{--c:var(--r-legendary)}.r5{--c:var(--r-mythic)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;background:var(--topbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;line-height:1}
.chips{display:flex;gap:8px;order:3;width:100%;overflow-x:auto;padding-bottom:2px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.chip svg{width:16px;height:16px;color:var(--mute)}
.chip .cur{color:var(--gold);font-weight:800}
.chip.bump{animation:bump .4s ease}
.lv{display:flex;flex-direction:column;gap:5px;min-width:128px}
.lv .row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.lv .row span{color:var(--mute)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-d),var(--blue));border-radius:99px;transition:width .4s ease}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:9px;color:var(--mute);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--blue);color:var(--on-acc)}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text)}
.ib:hover{border-color:var(--line2)}
.ib svg{width:19px;height:19px}

/* ---------- shell ---------- */
.side{display:none}
.page{padding:16px 14px 96px;max-width:1200px;margin:0 auto;width:100%}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:600;text-align:left;position:relative}
.nav-btn svg{width:20px;height:20px;flex:0 0 auto}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.on{background:rgba(var(--acc-rgb),.14);color:var(--text)}
.nav-btn.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--blue)}
.side-note{font-size:12px;color:var(--mute);padding:14px;line-height:1.5}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:10px;font-weight:600;border-radius:10px;min-width:0}
.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav svg{width:21px;height:21px}
.bnav button.on{color:var(--text)}
.bnav button.on svg{color:var(--blue)}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:224px minmax(0,1fr)}
  .side{display:block;position:sticky;top:86px;align-self:start;padding:18px 12px}
  .bnav{display:none}
  .page{padding:24px 28px 48px}
  .chips{order:0;width:auto;overflow:visible}
  .top{padding:12px 22px}
}

/* ---------- generic ---------- */
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;gap:12px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:700;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--line2);background:var(--hover)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-acc);box-shadow:0 10px 28px -10px rgba(var(--acc-rgb),.8)}
.btn.pri:hover:not(:disabled){background:var(--acc-h);border-color:var(--acc-h)}
.btn.big{padding:16px 30px;font-size:17px;flex-direction:column;gap:1px;min-width:220px}
.btn.big small{font-size:12px;font-weight:600;opacity:.85}
.btn.danger{border-color:var(--danger-b);color:var(--danger-t)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.rb{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:700;font-size:14px}
.rb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chipf{border:1px solid var(--line);background:var(--card);color:var(--mute);padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.chipf.on{background:rgba(var(--acc-rgb),.16);border-color:var(--blue);color:var(--text)}
.chipf i{font-style:normal;opacity:.7;margin-left:5px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
select,input[type=text],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text)}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--soft);color:var(--mute);font-size:12px;font-weight:600}
.muted{color:var(--mute)}

/* ---------- plate ---------- */
.plate{position:relative;width:100%;aspect-ratio:520/112;container-type:inline-size;--shine:0}
.pl-in{position:absolute;inset:0;border-radius:3.2cqw;border:.8cqw solid #0e1013;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.012) 0 2px,rgba(255,255,255,.015) 2px 4px),linear-gradient(180deg,#fcfcf9 0%,#ecece7 50%,#d9dad5 100%);
  box-shadow:inset 0 .6cqw 1cqw rgba(255,255,255,.9),inset 0 -.8cqw 1.4cqw rgba(0,0,0,.18)}
.pl-in::before{content:"";position:absolute;inset:1.1cqw;border:.45cqw solid #17191d;border-radius:2.1cqw;pointer-events:none}
.pl-flag{position:absolute;left:0;top:0;bottom:0;width:12.2cqw;background:linear-gradient(180deg,#2766dd,#1a4bb0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1cqw;border-right:.4cqw solid #0e1013}
.pl-eu{display:block;width:5.6cqw;height:3.8cqw;background:linear-gradient(180deg,#1f6bff 50%,#ffd43b 50%);border-radius:.5cqw;box-shadow:0 0 0 .25cqw rgba(255,255,255,.55)}
.pl-flag b{color:#fff;font-size:4.6cqw;line-height:1;font-weight:800;font-family:Inter,sans-serif;letter-spacing:.02em}
.pl-txt{position:absolute;left:13.4cqw;right:1.6cqw;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:3.2cqw;
  font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;font-size:18.5cqw;line-height:1;color:#111316;
  text-shadow:0 .28cqw 0 rgba(255,255,255,.75),0 -.12cqw 0 rgba(0,0,0,.55)}
.grp{display:flex;gap:.6cqw}
.dg{gap:.9cqw}
.c{font-style:normal;display:inline-block;min-width:.44em;text-align:center}
.pl-shine{position:absolute;inset:0;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);transform:translateX(-120%);pointer-events:none;mix-blend-mode:soft-light}
.plate.pop .pl-shine{animation:shine 1.1s ease .15s 1}
.plate.pop{animation:plateIn .55s cubic-bezier(.2,.8,.2,1)}
.plate[data-r=legendary] .pl-in{background:repeating-linear-gradient(90deg,rgba(0,0,0,.012) 0 2px,rgba(255,255,255,.02) 2px 4px),linear-gradient(180deg,#fff8e2,#efdca8 55%,#dcc47f)}
.plate[data-r=mythic] .pl-in{background:linear-gradient(115deg,#fffaea,#f7de98 28%,#fff5d2 52%,#f0d07c 78%,#fff4cb)}
.plate[data-r=mythic] .pl-shine{animation:shine 3.2s ease-in-out infinite}
.plate.sm .pl-txt{font-size:19.5cqw}

/* ---------- generator ---------- */
.gen-grid{display:grid;gap:16px}
@media(min-width:1100px){.gen-grid{grid-template-columns:minmax(0,1fr) 300px}}
.stage{--glow:rgba(40,120,255,.0);position:relative;padding:34px 18px 22px;border-radius:24px;border:1px solid var(--line);
  background:radial-gradient(ellipse 70% 55% at 50% 38%,rgba(var(--acc-rgb),.12),transparent 70%),var(--card);overflow:hidden}
.stage[data-r=uncommon]{--glow:rgba(74,163,160,.35)}
.stage[data-r=rare]{--glow:rgba(40,120,255,.5)}
.stage[data-r=epic]{--glow:rgba(155,123,242,.55)}
.stage[data-r=legendary]{--glow:rgba(217,164,65,.6)}
.stage[data-r=mythic]{--glow:rgba(255,226,160,.8)}
.plate-wrap{width:min(600px,100%);margin:0 auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.65)) drop-shadow(0 0 26px var(--glow));transition:filter .4s}
.dais{width:min(680px,96%);height:30px;margin:6px auto 0;border-radius:10px 10px 22px 22px;background:linear-gradient(180deg,var(--dais1),var(--dais2) 45%,var(--dais3));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -14px 40px -14px var(--glow),0 18px 30px -12px rgba(0,0,0,.9)}
.info{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:center;align-items:center;margin-top:22px;text-align:center}
.kv{display:flex;flex-direction:column;gap:1px}
.kv span{font-size:12.5px;color:var(--mute)}
.kv b{font-size:19px;font-variant-numeric:tabular-nums}
.kv b.gold{color:var(--gold)}
.reg{width:100%;text-align:center;color:var(--mute);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;margin-top:18px;justify-content:flex-start}
.thumb{flex:0 0 auto;width:130px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:8px;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.thumb.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 16px -4px var(--c)}
.thumb small{font-size:11px;color:var(--c);font-weight:700;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile span{display:block;font-size:12px;color:var(--mute)}
.tile b{font-size:17px;font-variant-numeric:tabular-nums}
.hint{margin-top:12px;text-align:center;color:var(--mute);font-size:13px}
.hist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hist-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:13px}
.hist-row .m{display:flex;flex-direction:column}
.hist-row .m b{color:var(--c);font-size:12px}
.hist-row .m span{color:var(--mute);font-variant-numeric:tabular-nums}

/* ---------- collection ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.pc:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.pc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.pc .val{font-weight:800;font-variant-numeric:tabular-nums}
.pc .d{font-size:12px;color:var(--mute)}
.pc .row{display:flex;gap:8px}
.pc .row .btn{flex:1}
.fav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;color:var(--mute);flex:0 0 auto!important}
.fav svg{width:18px;height:18px}
.fav.on{color:var(--gold);border-color:#5b4a22}
.empty{border:1px dashed var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--mute)}

/* ---------- upgrades / quests / ach ---------- */
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.up h3,.qc h3{margin:0 0 3px;font-size:16px}
.up p,.qc p{margin:0 0 10px;color:var(--mute);font-size:13.5px}
.pips{display:flex;gap:4px;margin:8px 0 12px}
.pips i{flex:1;height:7px;border-radius:4px;background:var(--soft)}
.pips i.on{background:var(--blue);box-shadow:0 0 8px rgba(var(--acc-rgb),.6)}
.eff{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:12px}
.eff div{display:flex;flex-direction:column}
.eff span{color:var(--mute);font-size:12px}
.eff b{font-variant-numeric:tabular-nums}
.lock{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-bottom:8px}
.lock svg{width:15px;height:15px}
.qc .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qc .rw{color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
.qc.done{border-color:#24473a}
.ac.off{opacity:.55}

'use strict';
/* =====================================================================
   PLATEX — локальная версия. Модули (в одном файле для публикации):
   Config · Regions · Plates(generator) · Rarity · Economy · Storage ·
   I18N · Sound · State/Actions · UI

/* ===================== Config ===================== */
const LETTERS = 'ABCEHIKMOPTX'.split('');           // только буквы с кирилло-латинскими двойниками
const DIGITS = '0123456789';

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ===================== Regions (справочник) ===================== */
// Игровой справочник. Не является официальным источником.
const REGION_DATA = [
  [['AA','KA'],'Київ','Киев'],
  [['AB','KB'],'Вінницька область','Винницкая область'],
  [['AC','KC'],'Волинська область','Волынская область'],

  [['BA','HA'],'Кіровоградська область','Кировоградская область'],
  [['BB','HB'],'Луганська область','Луганская область'],
  [['BC','HC'],'Львівська область','Львовская область'],
  [['BE','HE'],'Миколаївська область','Николаевская область'],
  [['BH','HH'],'Одеська область','Одесская область'],
  [['BI','HI'],'Полтавська область','Полтавская область'],

  [['BM','HM'],'Сумська область','Сумская область'],

  [['CE','IE'],'Чернівецька область','Черновицкая область']
].map(([codes,uk,ru])=>({codes,uk,ru}));
const REGION_BY_CODE = {};
REGION_DATA.forEach(r=>r.codes.forEach(c=>REGION_BY_CODE[c]=r));
const PREMIUM = new Set(['AA','KA','AI','KI']);

/* ===================== Rarity (классификатор) ===================== */
const EPIC_DIGITS = new Set(['0001','0007','0777','0100']);
const MYTHIC_DIGITS = new Set(['7777','0001','0007','8888']);
const plateStr = p => `${p.region} ${p.digits} ${p.series}`;

function digitTier(d){
  const n = d.split('').map(Number);
  if(new Set(n).size===1) return 3;                 // 1111, 7777...
  if(EPIC_DIGITS.has(d)) return 3;
  const asc = n.every((x,i)=>i===0||x===n[i-1]+1), desc = n.every((x,i)=>i===0||x===n[i-1]-1);
  if(asc||desc) return 2;                           // 1234, 4321
  if(n[0]===n[2]&&n[1]===n[3]) return 2;            // 2020, 1212
  const y = +d; if(y>=1980&&y<=2026) return 2;      // годы
  if(n[0]!==0&&n[1]===0&&n[2]===0&&n[3]===0) return 2; // 5000
  const cnt = {}; n.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  if(Math.max(...Object.values(cnt))>=3) return 1;  // тройки
  if(n[0]===n[1]&&n[2]===n[3]) return 1;            // 1122
  if(n[0]===n[3]&&n[1]===n[2]) return 1;            // 1221
  return 0;
}
function letterTier(p){ return (p.series[0]===p.series[1] || p.series===p.region) ? 1 : 0; }
function classify(p){
  const D = digitTier(p.digits), L = letterTier(p), prem = PREMIUM.has(p.region);
  if(D===3 && MYTHIC_DIGITS.has(p.digits) && (p.region==='AA'||p.region==='KA') && p.series==='AA') return 5;
  if(D===3 && (L>=1 || prem)) return 4;
  if(D===2 && L>=1 && prem) return 4;
  if(D===3 || (D===2 && L>=1)) return 3;
  if(D===2 || (D===1 && L>=1)) return 2;
  if(D===1 || L>=1) return 1;
  return 0;
}
function hash01(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)/4294967295; }

/* ===================== Plates (генератор) ===================== */
function randDigits(){ let s=''; for(let i=0;i<4;i++) s+=pick(DIGITS); return s==='0000'?randDigits():s; }
function genDigits(tier){
  if(tier===3){ if(Math.random()<.6){ const d=pick('123456789'.split('')); return d.repeat(4);} return pick([...EPIC_DIGITS]); }
  if(tier===2){
    const k=Math.floor(Math.random()*4);
    if(k===0){ const asc=Math.random()<.5; let s=''; if(asc){ const a=Math.floor(Math.random()*7); for(let i=0;i<4;i++) s+=a+i; } else { const a=3+Math.floor(Math.random()*7); for(let i=0;i<4;i++) s+=a-i; } return s; }
    if(k===1){ const a=pick(DIGITS.split('')); let b; do{ b=pick(DIGITS.split('')); }while(b===a); return a+b+a+b; }
    if(k===2){ return String(1980+Math.floor(Math.random()*47)); }
    return pick('123456789'.split(''))+'000';
  }
  if(tier===1){
    const k=Math.floor(Math.random()*3), a=pick(DIGITS.split('')); let b; do{ b=pick(DIGITS.split('')); }while(b===a);
    if(k===0){ const pos=Math.floor(Math.random()*4); const arr=[a,a,a,a]; arr[pos]=b; return arr.join(''); }
    if(k===1) return a+a+b+b;
    return a+b+b+a;
  }
  let s; do{ s=randDigits(); }while(digitTier(s)!==0); return s;
}
function genRegion(prem){ if(prem===false){ let c; do{ c=pick(pick(REGION_DATA).codes); }while(PREMIUM.has(c)); return c; } return pick(pick(REGION_DATA).codes); }
function genSeries(double){ if(double){ const l=pick(LETTERS); return l+l; } let a,b; do{ a=pick(LETTERS); b=pick(LETTERS); }while(a===b); return a+b; }
function makeForTier(t){
  let p;
  for(let i=0;i<120;i++){
    switch(t){
      case 5: p={region:pick(['AA','KA']),digits:pick([...MYTHIC_DIGITS]),series:'AA'}; break;
      case 4: p={region:genRegion(),digits:genDigits(3),series:genSeries(Math.random()<.6)}; break;
      case 3: p = Math.random()<.65 ? {region:genRegion(false),digits:genDigits(3),series:genSeries(false)} : {region:genRegion(false),digits:genDigits(2),series:genSeries(true)}; break;
      case 2: p={region:genRegion(),digits:genDigits(2),series:genSeries(false)}; break;
      case 1: p = Math.random()<.7 ? {region:genRegion(),digits:genDigits(1),series:genSeries(false)} : {region:genRegion(),digits:genDigits(0),series:genSeries(true)}; break;
      default: p={region:genRegion(),digits:genDigits(0),series:genSeries(false)};
    }
    if(classify(p)===t) return p;
  }
  return p;
}

function cyrb53(str){ let h1=0xdeadbeef,h2=0x41c6ce57; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
const SIG_SALT='platex|komiks|2026|';
function sigPayload(o){ const c={...o}; delete c._sig; delete c.settings; return JSON.stringify(c); }

const AudioMgr = {
  ctx:null,master:null,musicBus:null,sfxBus:null,noise:null,

      this.musicBus=c.createGain(); this.musicBus.gain.value=0; this.musicBus.connect(this.master);
      this.sfxBus=c.createGain(); this.sfxBus.connect(this.master);
      const len=c.sampleRate, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.noise=b;
      c.onstatechange=()=>renderMusicUI();

    }catch(e){ this.ctx=null; return false; }
  },
  unlock(){ if(!this.init()) return false; if(this.ctx.state!=='running') this.ctx.resume().catch(()=>{}); return true; },
  running(){ return !!this.ctx && this.ctx.state==='running'; },
  applyVolumes(){ if(!this.ctx||!S) return; const n=this.ctx.currentTime,s=S.settings; this.master.gain.setTargetAtTime(s.sound?1:0,n,.05); this.sfxBus.gain.setTargetAtTime(s.sfxVol/100*1.6,n,.03); }

function voice(dest,type,f,t,dur,peak,o){

  osc.type=type; osc.frequency.setValueAtTime(f,t); if(o.detune) osc.detune.value=o.detune;
  let node=osc; if(o.lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; fl.Q.value=o.q||.7; osc.connect(fl); node=fl; }
  node.connect(g); g.connect(dest);
  const a=o.a||.005, rel=Math.min(o.r||.1,dur);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.setValueAtTime(peak,t+Math.max(a,dur-rel)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+(o.sd||dur));
  osc.start(t); osc.stop(t+dur+.05);
}
function noiseHit(dest,t,dur,peak,o){
  o=o||{}; const c=AudioMgr.ctx, src=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain();
  src.buffer=AudioMgr.noise; src.loop=true; fl.type=o.type||'highpass'; fl.frequency.value=o.freq||6000; fl.Q.value=o.q||.7;
  src.connect(fl); fl.connect(g); g.connect(dest);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(peak,t+.003); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.start(t,Math.random()*.5); src.stop(t+dur+.02);
}

function musicStep(r,s,t,sd){
  const tr=r.track, bars=tr.chords.length, bar=Math.floor(s/16)%bars, pos=s%16, sec=Math.floor(s/(16*bars))%4;
  const chord=tr.chords[bar], root=tr.roots[bar], tt=t+((pos%2)?tr.swing*sd:0), beat=sd*4, o=r.out;
  if(pos===0) chord.forEach((n,i)=>{
    voice(o,'sawtooth',mtof(n),t,beat*4+.3,.02,{a:.8,r:1.2,lp:tr.padLp,detune:(i%2?7:-7)});
    voice(o,'triangle',mtof(n-12),t,beat*4+.3,.02,{a:1,r:1.2,lp:900});
  });
  if(sec!==3&&tr.kick.includes(pos)) voice(o,'sine',110,tt,.24,.24,{slide:42,sd:.16,a:.003,r:.12});
  tr.bass.forEach(b=>{ if(b[0]===pos){ const f=mtof(root); voice(o,'sine',f,tt,sd*b[1],.2,{a:.01,r:.06}); voice(o,'triangle',f*2,tt,sd*b[1],.05,{a:.01,r:.06,lp:700}); } });
  if(sec>=1&&tr.hat.includes(pos)) noiseHit(o,tt,.05,.028,{type:'highpass',freq:7000});
  if(tr.snare&&tr.snare.includes(pos)) noiseHit(o,tt,.14,.055,{type:'bandpass',freq:1800,q:.8});
  if(sec>=2&&tr.arp.includes(pos)){ const k=r.arpI++, n=chord[k%chord.length]+12*(1+((k>>2)%2)); voice(r.send,'triangle',mtof(n),tt,sd*2.5,.042,{a:.004,r:.2,lp:2600}); }

const Music = {
  on:false, token:0, run:null, timer:null, stopT:null, sessionTracks:[],
  tracks(){ return SYNTH.concat(CUSTOM_TRACKS,this.sessionTracks); },
  cur(){ return this.tracks().find(x=>x.id===S.settings.track)||SYNTH[0]; },
  want(){ const s=S.settings; return !!(s.sound&&s.music&&!s.musicPaused); },
  target(){ return this.want()?S.settings.musicVol/100*1.2:0; },
  ramp(to,sec){ const g=AudioMgr.musicBus.gain,n=AudioMgr.ctx.currentTime; g.cancelScheduledValues(n); g.setValueAtTime(g.value,n); g.linearRampToValueAtTime(to,n+sec); },
  setVol(){ if(this.on&&AudioMgr.ctx) AudioMgr.musicBus.gain.setTargetAtTime(this.target(),AudioMgr.ctx.currentTime,.08); },
  sync(){
    const w=this.want();
    if(w&&!this.on){ if(!AudioMgr.running()){ renderMusicUI(); return; } this.begin(4); }
    else if(!w&&this.on) this.end(.9);
    else this.setVol();
    renderMusicUI();
  },
  begin(fade){
    clearTimeout(this.stopT); this.token++;
    if(!this.run) this.startRun();
    this.on=true; this.ramp(this.target(),fade);
  },
  end(fade){
    this.on=false; this.ramp(0,fade); const tk=++this.token;
    this.stopT=setTimeout(()=>{ if(this.token===tk) this.killRun(); },fade*1000+120);
  },
  setTrack(id){
    S.settings.track=id; save();
    if(!this.on) { this.killRun(); return; }
    const tk=++this.token; this.ramp(0,.5);
    setTimeout(()=>{ if(this.token!==tk) return; this.killRun(); this.startRun(); this.ramp(this.target(),1.6); },560);
  },
  startRun(){
    const c=AudioMgr.ctx, tr=this.cur(), out=c.createGain();
    if(tr.type==='file'){
      out.connect(AudioMgr.musicBus);
      const el=new Audio(); el.crossOrigin='anonymous'; el.loop=true; el.preload='auto';
      this.run={file:true,el,out,track:tr};
      try{ this.run.src=c.createMediaElementSource(el); this.run.src.connect(out); }catch(e){ this.fileFail(tr); return; }
      el.addEventListener('error',()=>this.fileFail(tr));
      el.src=tr.src; const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>this.fileFail(tr));
      return;
    }
    if(tr.lp){ const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=tr.lp; out.connect(lp); lp.connect(AudioMgr.musicBus); } else out.connect(AudioMgr.musicBus);
    const send=c.createGain(), dl=c.createDelay(1.5), fb=c.createGain(), dlp=c.createBiquadFilter();
    dl.delayTime.value=60/tr.bpm*.75; fb.gain.value=.38; dlp.type='lowpass'; dlp.frequency.value=2200;
    send.connect(out); send.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(out);
    this.run={out,send,track:tr,step:0,next:c.currentTime+.15,arpI:0};
    this.timer=setInterval(()=>this.tick(),150);
  },
  tick(){
    const r=this.run; if(!r||r.file||!AudioMgr.running()) return;
    const c=AudioMgr.ctx, sd=60/r.track.bpm/4;
    if(r.next<c.currentTime-.3) r.next=c.currentTime+.05;
    while(r.next<c.currentTime+1.2){ musicStep(r,r.step,r.next,sd); r.next+=sd; r.step++; }
  },
  killRun(){
    clearInterval(this.timer); this.timer=null;
    const r=this.run; if(!r) return; this.run=null;
    if(r.el){ try{ r.el.pause(); r.el.removeAttribute('src'); r.el.load(); }catch(e){} }
    try{ if(r.src) r.src.disconnect(); }catch(e){}
    try{ r.out.disconnect(); }catch(e){}
  },
  fileFail(tr){
    if(!this.run||this.run.track!==tr) return;
    toast(t('errAudio',{n:tr.name}),'err'); S.settings.track=SYNTH[0].id; save();
    this.killRun(); if(this.on) this.startRun(); renderAll();

};

function cleanItem(i){
  if(!i||typeof i!=='object') return null;
  if(!REGION_BY_CODE[i.region]) return null;
  if(!/^\d{4}$/.test(String(i.digits))||i.digits==='0000') return null;
  if(!/^[ABCEHIKMOPTX]{2}$/.test(String(i.series))) return null;
  const p={region:i.region,digits:String(i.digits),series:i.series}, r=classify(p);
  return {id:typeof i.id==='string'&&i.id?i.id.slice(0,40):uid(),...p,rarity:r,value:plateValue(p,r),ts:Number.isFinite(i.ts)?i.ts:Date.now(),fav:!!i.fav};
}
function sanitize(raw){
  const d=defaultState(); if(!raw||typeof raw!=='object') return d;
  const num=(v,def,min)=>Number.isFinite(v)&&v>=(min||0)?Math.floor(v):def;
  d.balance=num(raw.balance,d.balance); d.level=Math.max(1,num(raw.level,1)); d.xp=num(raw.xp,0);
  while(d.xp>=xpNeed(d.level)) d.xp=0;
  if(typeof raw.nickname==='string'&&raw.nickname.trim()) d.nickname=raw.nickname.trim().slice(0,16);
  UPG_IDS.forEach(k=>d.upg[k]=Math.min(MAXLVL,num(raw.upg&&raw.upg[k],0)));
  const seen=new Set(), take=a=>(Array.isArray(a)?a:[]).map(cleanItem).filter(x=>{ if(!x||seen.has(x.id)) return false; seen.add(x.id); return true; });
  d.collection=take(raw.collection).slice(0,slotsFor(d.upg.collector));
  d.pending=take(raw.pending).slice(0,bulkCount(d.upg.bulk));
  d.history=(Array.isArray(raw.history)?raw.history:[]).map(cleanItem).filter(Boolean).slice(0,8);
  const st=raw.stats||{};
  ['generated','sold','collected','earned','spent','repeatFound','prettyFound'].forEach(k=>d.stats[k]=num(st[k],0));
  d.stats.best=Number.isFinite(st.best)?Math.max(-1,Math.min(5,Math.floor(st.best))):-1;
  d.stats.byRarity=d.stats.byRarity.map((_,i)=>num(st.byRarity&&st.byRarity[i],0));
  d.stats.bestPlate=cleanItem(st.bestPlate);
  const dl=raw.daily||{}; if(dl.day===todayKey()){ d.daily={day:dl.day,gen:num(dl.gen,0),sold:num(dl.sold,0),unc:num(dl.unc,0),epic:num(dl.epic,0),claimed:{}}; QUESTS.forEach(q=>{ if(dl.claimed&&dl.claimed[q.id]===true) d.daily.claimed[q.id]=true; }); }
  if(raw.ach&&typeof raw.ach==='object') ACH.forEach(a=>{ if(Number.isFinite(raw.ach[a.id])) d.ach[a.id]=raw.ach[a.id]; });
  const se=raw.settings||{}; ['sound','reduced','autosell','music','musicPaused'].forEach(k=>{ if(typeof se[k]==='boolean') d.settings[k]=se[k]; });
  const nm=(v,def)=>Number.isFinite(v)?Math.max(0,Math.min(100,Math.round(v))):def; d.settings.musicVol=nm(se.musicVol,15); d.settings.sfxVol=nm(se.sfxVol,30);
  if(THEMES.includes(se.theme)) d.settings.theme=se.theme; if(typeof se.track==='string'&&se.track.length<48) d.settings.track=se.track;
  return d;
}

  if(ui.spin) return;

  if(S.pending.length){ err(t('errPending')); return; }
  const n=bulkCount(S.upg.bulk), cost=genCost(S.level)*n;
  if(S.balance<cost){
    if(!S.collection.length){ S.balance=cost; notify(t('aid',{n:fmt(cost)}),'ok'); }
    else { err(t('errNoMoney',{n:fmt(cost)})); return; }
  }
  S.balance-=cost; S.stats.spent+=cost;
  const w=weights(S.upg.luck), plates=[]; let xp=0;
  for(let i=0;i<n;i++){
    const p=makeForTier(rollTier(w)), r=classify(p);
    plates.push({id:uid(),...p,rarity:r,value:plateValue(p,r),ts:Date.now(),fav:false});
  }
  plates.forEach(pl=>{
    S.stats.byRarity[pl.rarity]++; xp+=5+XP_R[pl.rarity];
    if(digitTier(pl.digits)>=1||letterTier(pl)>=1) S.stats.repeatFound++;
    if(digitTier(pl.digits)>=2) S.stats.prettyFound++;
    if(pl.rarity===1) S.daily.unc++; if(pl.rarity>=3) S.daily.epic++;
    const bp=S.stats.bestPlate; if(!bp||pl.rarity>bp.rarity||(pl.rarity===bp.rarity&&pl.value>bp.value)){ S.stats.best=pl.rarity; S.stats.bestPlate={...pl}; }
  });
  S.stats.generated+=n; S.daily.gen+=n;
  S.pending=plates; ui.sel=bestIndex(plates);
  startSpin(plates);
  addXp(xp);
  Sound.play('gen');
  commit();
}

function tweenBal(a,b){
  const el=document.querySelector('#balChip .num'), chip=document.getElementById('balChip'); if(!el||S.settings.reduced) return;
  chip.classList.toggle('up',b>a); chip.classList.toggle('down',b<a);
  const t0=performance.now(); cancelAnimationFrame(ui.balRaf);
  const step=now=>{ const k=Math.min(1,(now-t0)/550), e=1-Math.pow(1-k,3); el.textContent=fmt(Math.round(a+(b-a)*e)); if(k<1) ui.balRaf=requestAnimationFrame(step); else chip.classList.remove('up','down'); };
  ui.balRaf=requestAnimationFrame(step);
}

function pageGen(){
  const n=bulkCount(S.upg.bulk), cost=genCost(S.level)*n, sp=ui.spin, la=S.upg.appraiser;
  const sel=S.pending[ui.sel]||null, slots=slotsFor(S.upg.collector);
  let chars=['·','·','·','·','·','·','·','·'], rar='';
  if(sp){ chars=sp.chars; if(la>=3) rar=RARITIES[sp.best.rarity]; }
  else if(sel){ chars=[...sel.region,...sel.digits,...sel.series]; rar=RARITIES[sel.rarity]; }
  let rn='—',val='—',inc='—',reg='—',ri=0;
  if(sp){ rn=la>=3?rName(sp.best.rarity):'…'; ri=la>=3?sp.best.rarity:0; val=la>=5?'≈ '+money(sp.best.value):'…'; inc='…'; }
  else if(sel){ ri=sel.rarity; rn=rName(sel.rarity); val=la>=1?money(sel.value):'≈ '+money(approx(sel.value)); inc=la>=1?money(income(sel)):'≈ '+money(approx(income(sel))); reg=`${regionName(sel.region)} (${sel.region})`; }
  const thumbs = (!sp&&S.pending.length>1)? `<div class="thumbs">${S.pending.map((x,i)=>`<button class="thumb r${x.rarity} ${i===ui.sel?'on':''}" data-act="pick" data-v="${i}">${pl(x,{cls:'sm'})}<small>${esc(rName(x.rarity))}</small></button>`).join('')}</div>`:'';
  const multi=!sp&&S.pending.length>1;
  const hist = S.history.length? S.history.map(h=>`<div class="hist-row r${h.rarity}">${pl(h,{cls:'sm'})}<div class="m"><b>${esc(rName(h.rarity))}</b><span>${esc(plateStr(h))}</span></div></div>`).join('') : `<div class="muted" style="font-size:13px">${t('noHistory')}</div>`;
  return `<h1>${t('nav_gen')}</h1><p class="sub">${t('hotkeys')}</p>
  <div class="gen-grid"><div>
    <div class="stage" data-r="${rar||'none'}">
      <div class="plate-wrap">${plateHTML(chars,rar,{id:'mainPlate',cls:ui.pop?'pop':''})}</div>
      <div class="dais"></div>
      <div class="info">
        <span class="rb r${ri}">${esc(rn)}</span>
        <div class="kv"><span>${t('vCost')}</span><b class="num">${val}</b></div>
        <div class="kv"><span>${t('vIncome')}</span><b class="num gold">${inc}</b></div>
        <div class="reg">${t('region')}: ${esc(reg)}</div>
      </div>
      <div class="actions">
        <button class="btn pri big" data-act="gen" ${sp?'disabled':''}>${t('generate')}<small>${money(cost)}${n>1?' · ×'+n:''}</small></button>
        <button class="btn" data-act="sell" ${(!sel||sp)?'disabled':''}>${t('sell')}</button>
        <button class="btn" data-act="collect" ${(!sel||sp)?'disabled':''}>${t('toColl')}</button>
      </div>
      ${multi?`<div class="actions" style="margin-top:10px"><button class="btn sm" data-act="sellAll">${t('sellAll')}</button><button class="btn sm" data-act="collAll">${t('collAll')}</button></div>`:''}
      ${thumbs}
      <div class="hint">${(!sp&&S.pending.length)?esc(t('pendingHint',{n:S.pending.length})):esc(t('idleHint'))}</div>
    </div>
    <div class="tiles">
      <div class="tile"><span>${t('genPrice')}</span><b>${money(cost)}</b></div>
      <div class="tile"><span>${t('slots')}</span><b>${S.collection.length}/${slots}</b></div>
      <div class="tile"><span>${t('up_luck')}</span><b>×${luckMult(S.upg.luck).toFixed(2)}</b></div>

function pageColl(){
  const f=ui.filter, slots=slotsFor(S.upg.collector);
  const cnt={all:S.collection.length,fav:S.collection.filter(x=>x.fav).length}; RARITIES.forEach((r,i)=>cnt[r]=S.collection.filter(x=>x.rarity===i).length);
  const sorters={value:(a,b)=>b.value-a.value,rarity:(a,b)=>b.rarity-a.rarity||b.value-a.value,date:(a,b)=>b.ts-a.ts};
  const list=S.collection.filter(x=>f==='all'||(f==='fav'?x.fav:RARITIES[x.rarity]===f)).sort((a,b)=>(Number(b.fav)-Number(a.fav))||sorters[ui.sort](a,b));
  const fl=['all',...RARITIES,'fav'];
  const commons=S.collection.filter(x=>x.rarity===0&&!x.fav).length;
  const cards=list.map((x,i)=>`<div class="pc r${x.rarity}" style="--i:${Math.min(i,14)}">${pl(x,{cls:'sm'})}
    <div class="meta"><span class="rb r${x.rarity}">${esc(rName(x.rarity))}</span><span class="val num">${money(x.value)}</span></div>

    <button class="fav ${x.fav?'on':''}" data-act="fav" data-id="${x.id}" aria-pressed="${x.fav}" aria-label="${esc(x.fav?t('unpin'):t('pin'))}" title="${esc(x.fav?t('unpin'):t('pin'))}">${ic('star',x.fav)}</button></div></div>`).join('');

  ${list.length?`<div class="cards ${ui.collEnter?'enter':''}">${cards}</div>`:`<div class="empty">${S.collection.length?t('noFiltered'):t('emptyColl')}</div>`}`;

function pageUpg(){
  return `<h1>${t('upgTitle')}</h1><p class="sub">${t('upgSub')}</p><div class="list">${UPG_IDS.map(id=>{
    const l=S.upg[id], maxed=l>=MAXLVL, cost=maxed?0:upgCost(id,l), locked=!maxed&&S.level<l+1, can=!maxed&&!locked&&S.balance>=cost;
    return `<div class="card up"><h3>${t('up_'+id)}</h3><p>${t('d_'+id)}</p>
      <div class="pips">${Array.from({length:MAXLVL},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>
      <div class="eff"><div><span>${t('nowL')} · ${t('lvl',{l,m:MAXLVL})}</span><b>${esc(upgEffect(id,l))}</b></div>${maxed?'':`<div style="text-align:right"><span>${t('nextL')}</span><b>${esc(upgEffect(id,l+1))}</b></div>`}</div>
      ${locked?`<div class="lock">${ic('lock')}${t('needLevel',{n:l+1})}</div>`:''}
      <button class="btn ${can?'pri':''}" style="width:100%" data-act="buy" data-id="${id}" ${(maxed||locked)?'disabled':''}>${maxed?t('maxed'):t('buyFor',{n:fmt(cost)})}</button></div>`;
  }).join('')}</div>`;
}
function upgEffect(id,l){
  switch(id){
    case 'luck': return t('e_luck',{n:luckMult(l).toFixed(2)});
    case 'fast': return t('e_fast',{n:fastDur(l)});
    case 'bulk': return t('e_bulk',{n:bulkCount(l)});
    case 'appraiser': return t('e_app'+(l===0?0:l<3?1:l<5?2:3));
    case 'collector': return t('e_col',{n:slotsFor(l)});
    default: return t('e_sell',{n:l*5});
  }
}

document.addEventListener('pointerdown',e=>{ ui.click={x:e.clientX,y:e.clientY}; },true);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, id=el.dataset.id;
  if(a==='backdrop'){ if(e.target===el){ ui.modal=null; renderModal(); } return; }
  Sound._c(); uiSound(a);
  switch(a){
    case 'nav': ui.page=v; if(v==='coll') ui.collEnter=true; renderAll(); window.scrollTo(0,0); break;
    case 'gen': generate(); break;
    case 'sell': sellSelected(); break;
    case 'collect': collectSelected(); break;
    case 'sellAll': sellAllPending(); break;
    case 'collAll': collectAllPending(); break;
    case 'pick': ui.sel=+v; renderPage(); break;
    case 'filter': ui.filter=v; ui.collEnter=true; renderPage(); break;
    case 'fav': toggleFav(id); break;
    case 'sellItem': sellItem(id); break;
    case 'sellCommons': sellCommons(); break;
    case 'buy': buyUpgrade(id); break;
    case 'claim': claimQuest(id); break;
    case 'lang': setLang(v); break;
    case 'profile': ui.modal='profile'; renderModal(); break;
    case 'closeModal': ui.modal=null; renderModal(); break;
    case 'reset': ui.modal='reset'; renderModal(); break;
    case 'doReset': resetAll(); break;
    case 'nick': { const val=(document.getElementById('nickIn').value||'').trim().slice(0,16); S.nickname=val||null; save(); toast(t('nickSaved'),'ok'); renderAll(); break; }
    case 'export': ui.ioText=JSON.stringify(withSig(S)); ui.modal='export'; renderModal(); break;
    case 'import': ui.modal='import'; renderModal(); break;
    case 'copyIo': { const ta=document.getElementById('ioTa'); ta.select(); try{ (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).catch(()=>document.execCommand('copy')); }catch(x){ try{ document.execCommand('copy'); }catch(y){} } toast(t('copied'),'ok'); break; }
    case 'doImport': importSave(document.getElementById('ioTa').value); break;
    case 'theme': setTheme(v); break;
    case 'musicToggle': toggleMusic(); break;
    case 'musicPill': audioSync(); break;
    case 'trackPrev': stepTrack(-1); break;
    case 'trackNext': stepTrack(1); break;
    case 'loadTrack': { const f=document.getElementById('trackFile'); if(f) f.click(); break; }
  }
});
document.addEventListener('change',e=>{
  const el=e.target; const c=el.dataset&&el.dataset.change; if(!c) return;
  if(c==='sort'){ ui.sort=el.value; ui.collEnter=true; renderPage(); }
  else if(c==='tg'){ const k=el.dataset.k; S.settings[k]=el.checked; if(k==='music'&&el.checked) S.settings.musicPaused=false; applySettings(); save(); if(k==='sound'||k==='music') audioSync(); renderAll(); if(k==='sound'&&el.checked) Sound.play('ok'); }
  else if(c==='track'){ Music.setTrack(el.value); renderAll(); }
  else if(c==='vol'){ clearTimeout(ui.volT); save(); }
  else if(c==='file'){ addSessionTrack(el.files&&el.files[0]); el.value=''; }
});
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset&&el.dataset.input; if(!k) return;
  const v=Math.max(0,Math.min(100,+el.value||0)); S.settings[k]=v;
  const lb=document.getElementById('lbl_'+k); if(lb) lb.textContent=v+'%';
  if(AudioMgr.ctx){ AudioMgr.applyVolumes(); Music.setVol(); }
  clearTimeout(ui.volT); ui.volT=setTimeout(save,300);
  const n=performance.now(); if(k==='sfxVol'&&n-(ui.prevT||0)>320){ ui.prevT=n; Sound.play('ok'); }
});
document.addEventListener('pointerover',e=>{
  if(e.pointerType&&e.pointerType!=='mouse') return;
  const el=e.target.closest&&e.target.closest('button:not(:disabled),select');
  if(el&&el!==ui.hoverEl){ ui.hoverEl=el; Sound.play('hover'); } else if(!el) ui.hoverEl=null;
});
['pointerdown','keydown','touchend'].forEach(ev=>document.addEventListener(ev,gestureUnlock,{capture:true,passive:true}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal){ ui.modal=null; renderModal(); return; }
  const tg=e.target, tag=tg&&tg.tagName; if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||ui.modal||ui.page!=='gen') return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.code==='Space'){ if(tag==='BUTTON') return; e.preventDefault(); generate(); }
  else if(e.key==='s'||e.key==='S'||e.key==='ы'||e.key==='і'){ sellSelected(); }
  else if(e.key==='c'||e.key==='C'||e.key==='с'){ collectSelected(); }
});
setInterval(()=>{ if(S&&!ui.modal&&!ui.spin&&S.daily.day!==todayKey()){ checkDay(); save(); renderAll(); } },30000);

/* ===================== Init ===================== */
(function init(){
  const l=Storage.getLang(); LANG=l||'uk';                      // по умолчанию украинский
  const raw0=Storage.load();
  if(raw0&&raw0._sig!==undefined&&!sigOk(raw0)){ try{ localStorage.setItem('nomerua.backup',JSON.stringify(raw0)); }catch(e){} S=defaultState(); ui.tamper=true; }
  else S=sanitize(raw0);
  applySettings(); checkDay();
  if(S.pending.length) ui.sel=bestIndex(S.pending);
  checkAch(); ui.queue.splice(0).forEach(([m,ty])=>toast(m,ty));
  save(); renderAll(); hideSplash();
  if(ui.tamper) toast(t('errTamper'),'err',7000);
  window.addEventListener('storage',e=>{   // синхронизация вкладок: исключает двойную продажу из двух вкладок
    if(e.key!==Storage.key||!e.newValue||ui.spin) return;
    try{ const o=JSON.parse(e.newValue); if(o._sig!==undefined&&!sigOk(o)) return; S=sanitize(o); applySettings(); renderAll(); }catch(x){}
  });
})();
function hideSplash(){
  const sp=document.getElementById('splash'); if(!sp) return;
  const wait=S.settings.reduced?120:Math.max(150,1000-performance.now());
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),650); },wait);
}
</script>
